version: "3.9"

services:
  relay:
    build:
      context: ./backend
    container_name: tesla-dash-relay
    restart: unless-stopped
    ports:
      - "4000:4000"          # HTTP API + WebSocket upgrade (video/audio)
    volumes:
      - ./backend/data:/app/data        # streams.json config + sqlite tile db
      - ./backend/media:/app/media:ro   # optional local media files to serve
    environment:
      - PORT=4000
      - NODE_ENV=production
      - CORS_ORIGIN=*         # tighten to your dashboard origin in production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: ./frontend
      args:
        VITE_RELAY_HTTP_URL: "http://localhost:4000"
        VITE_RELAY_WS_URL: "ws://localhost:4000"
    container_name: tesla-dash-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - relay

networks:
  default:
    name: tesla-dashboard-net
